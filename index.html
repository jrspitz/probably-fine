<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>probably-fine</title>
  </head>
  <body>
    <div id="app">
      <div class="canvas-wrap">
        <div class="settings">
          <a
            class="icon-button"
            href="https://github.com/jrspitz/probably-fine"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="View source on GitHub"
            title="View source on GitHub"
          >
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
          </a>
          <button
            id="settingsButton"
            type="button"
            class="icon-button"
            aria-label="Settings"
            aria-expanded="false"
            aria-controls="settingsMenu"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <div class="settings-menu" id="settingsMenu">
            <label class="setting"><input type="checkbox" id="burningFloor" checked>Hot Floor</label>
            <label class="setting"><input type="checkbox" id="burningObstacle">Hot Cup</label>
            <label class="setting"><input type="checkbox" id="tempLegendToggle"> Temperature Legend</label>
            <label class="setting"><input type="checkbox" id="swirlButton"> Turbulent Swirls</label>
            <div class="setting">
              <label for="probabilitySlider">Swirl Probability</label>
              <input type="range" min="0" max="100" value="50" id="probabilitySlider" class="slider">
            </div>
            <div class="setting background-group">
              <span>Background</span>
              <label><input type="radio" name="background" value="none"> None</label>
              <label><input type="radio" name="background" value="checkers"> Checkers</label>
              <label><input type="radio" name="background" value="image"> Image</label>
              <label><input type="radio" name="background" value="video" checked> Video</label>
            </div>
            <div class="menu-links">
              <a class="menu-link" href="https://github.com/jrspitz/probably-fine" target="_blank" rel="noopener noreferrer">Source on GitHub</a>
              <p class="menu-credits">
                Based on <a href="https://kcgreendotcom.com/" target="_blank" rel="noopener noreferrer">Question Hound</a>
                by KC Green and
                <a href="https://matthias-research.github.io/pages/tenMinutePhysics/index.html" target="_blank" rel="noopener noreferrer">Ten Minute Physics</a>
                by Matthias Müller.
              </p>
            </div>
          </div>
        </div>
        <div class="canvas-stage">
          <video id="bgVideo" class="bg-video" loop muted playsinline preload="metadata" aria-hidden="true"></video>
          <canvas id="myCanvas"></canvas>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
